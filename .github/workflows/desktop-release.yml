name: Desktop Release

# Builds the standalone Tauri desktop app on each OS. Native addons
# (better-sqlite3, onnxruntime-node, nodejs-polars) cannot be cross-compiled,
# so every platform builds its own sidecar via `npm install` on that runner.
#
# Architecture: matrix jobs BUILD and upload installers as workflow artifacts
# only — they never write to the GitHub Release (concurrent release writes from
# multiple runners race and 422). A single `publish` job then attaches all
# artifacts to the draft release. macOS-Intel is omitted: that runner class is
# chronically unavailable on this tier and just hangs the run.
#
# Trigger: push a tag like `desktop-v0.1.0`, or run manually (build-only).

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
          - os: macos-14
            triple: aarch64-apple-darwin
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # No `version:` — pnpm/action-setup@v4 reads it from the root
      # package.json "packageManager" field (specifying both is an error).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/desktop/src-tauri/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('packages/desktop/src-tauri/Cargo.lock') }}

      - name: Install workspace deps
        # Not --frozen-lockfile: packages/daemon has an optional native dep
        # (node-portaudio) that doesn't resolve into the lockfile, which would
        # otherwise hard-fail the frozen check. The desktop build doesn't use it.
        run: pnpm install --no-frozen-lockfile

      - name: Build core
        run: pnpm --filter @coastal-ai/core build

      - name: Bundle sidecar (flat npm install of native deps for this OS)
        run: pnpm --filter @coastal-ai/core bundle:sidecar

      - name: Stage sidecar into the desktop package
        run: pnpm --filter @coastal-ai/desktop presync

      # Build only — no release args, so no concurrent release writes.
      - name: Build desktop app (Tauri)
        run: pnpm --filter @coastal-ai/desktop build

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coastal-desktop-${{ matrix.triple }}
          path: |
            packages/desktop/src-tauri/target/release/bundle/nsis/*.exe
            packages/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            packages/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            packages/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: ignore

  # Single job attaches every platform's installers to the draft release.
  publish:
    needs: build
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or reuse the draft release, attach installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --title "Coastal.AI Desktop $tag" --notes "Automated build."
          files=$(find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \))
          echo "Attaching:"; echo "$files"
          [ -n "$files" ] && gh release upload "$tag" $files --repo "$GITHUB_REPOSITORY" --clobber
