name: Desktop Release

# Builds the standalone Tauri desktop app on each OS. Native addons
# (better-sqlite3, onnxruntime-node, nodejs-polars) cannot be cross-compiled,
# so every platform builds its own sidecar via `npm install` on that runner.
#
# Trigger: push a tag like `desktop-v0.1.0`, or run manually.

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
          - os: macos-13
            triple: x86_64-apple-darwin
          - os: macos-14
            triple: aarch64-apple-darwin
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # No `version:` — pnpm/action-setup@v4 reads it from the root
      # package.json "packageManager" field (specifying both is an error).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/desktop/src-tauri/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('packages/desktop/src-tauri/Cargo.lock') }}

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm --filter @coastal-ai/core build

      - name: Bundle sidecar (flat npm install of native deps for this OS)
        run: pnpm --filter @coastal-ai/core bundle:sidecar

      - name: Stage sidecar into the desktop package
        run: pnpm --filter @coastal-ai/desktop presync

      - name: Build desktop app (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing is a follow-up — add TAURI_SIGNING_PRIVATE_KEY etc. here later.
        with:
          projectPath: packages/desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'Coastal.AI Desktop ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coastal-desktop-${{ matrix.triple }}
          path: |
            packages/desktop/src-tauri/target/release/bundle/nsis/*.exe
            packages/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            packages/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            packages/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: ignore
