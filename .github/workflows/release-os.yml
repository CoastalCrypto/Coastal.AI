name: Release — Coastal.AI OS

on:
  push:
    branches: [master]
    paths:
      - 'os/kiosk/**'
      - 'os/base/**'
      - '.github/workflows/release-os.yml'
    tags:
      - 'os-v*'
  workflow_dispatch:
    inputs:
      version:
        description: "ISO version (e.g. 1.0.0)"
        required: false
        default: "ci"
      attach_release:
        description: "Attach to GitHub Release with this tag (e.g. v1.0.0) — leave blank to skip"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install live-build and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            live-build qemu-system-x86 ovmf curl syslinux-utils

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#os-v}"
          else
            VERSION="${{ github.event.inputs.version || 'ci' }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build ISO
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sudo bash os/kiosk/build/build.sh "$VERSION"
          ls -lh coastalos-*.iso

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: QEMU smoke test
        run: |
          ISO=$(ls coastalos-*.iso | head -1)
          bash os/kiosk/build/test/smoke-test.sh "$ISO"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v7
        with:
          name: coastalos-${{ steps.version.outputs.version }}-${{ github.run_number }}.iso
          path: coastalos-*.iso
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release (tag push)
        if: ${{ github.ref_type == 'tag' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISO=$(ls coastalos-*.iso | head -1)
          gh release create "${{ github.ref_name }}" "$ISO" \
            --repo "${{ github.repository }}" \
            --title "CoastalOS ${{ github.ref_name }}" \
            --prerelease \
            --notes "Automated CoastalOS kiosk ISO build for ${{ github.ref_name }}. Passed the CI boot smoke test (QEMU liveness check); not yet dogfooded on real hardware." \
            || gh release upload "${{ github.ref_name }}" "$ISO" --repo "${{ github.repository }}" --clobber

      - name: Attach ISO to GitHub Release (manual dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.attach_release != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISO=$(ls coastalos-*.iso | head -1)
          gh release upload "${{ github.event.inputs.attach_release }}" "$ISO" \
            --repo "${{ github.repository }}" \
            --clobber
          echo "Attached $ISO to release ${{ github.event.inputs.attach_release }}"
