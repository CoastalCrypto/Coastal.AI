name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Catches new CodeQL query packs / rule updates against unchanged code —
    # a push-only trigger only re-scans code that changes.
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v6

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # build-mode: none — this is a scripting-language analysis (no
          # compile step CodeQL needs to observe); turbo's build graph and
          # the native sidecar bundling in apps/desktop would only slow the
          # scan down for no analysis benefit.
          build-mode: none

      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
