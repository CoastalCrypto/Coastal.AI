name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # node-portaudio is an optional dep that requires PortAudio headers
      - run: sudo apt-get install -y portaudio19-dev

      # Use --no-frozen-lockfile so the optional native dep (node-portaudio)
      # can be resolved on this runner without failing the specifier check.
      # Developers should run `pnpm install` on Linux/WSL after adding native
      # optional deps to keep pnpm-lock.yaml in sync.
      - run: pnpm install --no-frozen-lockfile

      # Install Playwright Chromium for the core package browser tool tests.
      # Playwright is a runtime dep in packages/core, not the workspace root,
      # so we must scope the install to that package.
      - run: pnpm --filter @coastal-ai/core exec playwright install chromium --with-deps

      # Engine CI builds/tests the shared workspace only. The desktop *product*
      # (@coastal-ai/desktop) is a Tauri shell that needs the bundled sidecar +
      # the Rust toolchain and has its own pipeline (release-desktop-app.yml), so
      # it is excluded here — otherwise its presync step fails CI with
      # "packages/core/sidecar-build missing".
      - run: pnpm exec turbo build --filter='!@coastal-ai/desktop'
      - run: pnpm exec turbo test --filter='!@coastal-ai/desktop'

  smoke:
    name: Docker smoke test
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/smoke-test-docker.sh

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: sudo apt-get install -y portaudio19-dev
      - run: pnpm install --no-frozen-lockfile

      # Informational, not blocking (continue-on-error): as of this job's
      # introduction the tree already carries ~130 high and 7 critical
      # advisories in transitive dependencies accumulated before this job
      # existed — mostly dev-tooling (vitest's tinypool, wait-on's joi) that
      # never ships, plus a couple of real ones worth a dedicated look
      # (nodejs-whisper's OS-command-injection advisory, currently believed
      # unreachable through this repo's own call site — see stt.ts — but not
      # yet fixed by a version bump since that crosses a pre-1.0 minor
      # boundary untested here). Flipping this to a hard gate before that
      # backlog is worked through would just make CI permanently red, which
      # trains everyone to ignore it — exactly the failure mode a security
      # gate is supposed to prevent. Dependabot (.github/dependabot.yml)
      # opens PRs for these on its own schedule; this job's job is
      # visibility in the log on every push, not blocking merges yet.
      - run: pnpm audit --audit-level=high
        continue-on-error: true
