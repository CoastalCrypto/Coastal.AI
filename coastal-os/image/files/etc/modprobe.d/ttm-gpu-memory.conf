# /etc/modprobe.d/ttm-gpu-memory.conf
#
# Required for BC-250 to load models > 5 GB. Without this, the default
# GTT cap (~50% of system RAM = ~7.4 GB) prevents 9B+ models from
# loading. Source: TechMakesArt/llama.cpp-bc250 README + akandr/bc250.
#
# Values are in PAGES (4 KB each). 4194304 pages = 16 GiB.
#   - pages_limit: total TTM page cap
#   - page_pool_size: pool reservation
options ttm pages_limit=4194304 page_pool_size=4194304
